# Local / ad-hoc stack (builds the app image).
# Production CI uses deploy/docker-compose.prod.yml + GHCR — see deploy/README.md.

services:
  stredan-db:
    image: postgres:16-alpine
    container_name: stredan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stredan
      POSTGRES_USER: stredan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stredan_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
      - "49.13.94.193:15434:5432" # MCP host; iptables allowlist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stredan -d stredan"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  stredan-app:
    build:
      context: .
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    image: ${STREDAN_IMAGE:-ghcr.io/dadoedo/stredan}:${IMAGE_TAG:-local}
    container_name: stredan-app
    restart: unless-stopped
    depends_on:
      stredan-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stredan:${POSTGRES_PASSWORD:-stredan_secret}@stredan-db:5432/stredan
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
    networks:
      - internal
      - web

volumes:
  pgdata:
    name: stredan_pgdata

networks:
  internal:
    name: stredan_internal
  web:
    name: web
    external: true
